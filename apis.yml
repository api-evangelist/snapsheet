aid: snapsheet
name: Snapsheet
description: >-
  Snapsheet is a cloud-based property & casualty (P&C) claims management platform
  for insurance carriers, MGAs, and TPAs. It runs the full claims lifecycle with
  no-code workflow configuration, intelligent automation, document management,
  virtual vehicle appraisals, total-loss settlement, integrated claims payments,
  and analytics. Snapsheet reports serving 170+ customers, including 16 of the top
  20 P&C carriers, and processing more than 400 million API calls per month. It
  exposes open APIs and webhooks to customers and partners for connecting policy,
  billing, underwriting, and vendor systems, though API access is arranged through
  its sales and partner channel rather than a public self-serve developer portal.
